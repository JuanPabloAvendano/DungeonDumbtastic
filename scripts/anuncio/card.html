<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --gold: #e3bf6a; --bg: #0d0b12; --arcane: #8f6bff; }
  html, body { margin: 0; height: 100%; background: radial-gradient(900px 500px at 50% 40%, #2a1d47 0%, var(--bg) 70%); color: #ece4d4; overflow: hidden; font-family: Inter, sans-serif; }
  .stage { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .scene { position: absolute; inset: 0; display: grid; place-content: center; gap: 14px; opacity: 0; }
  .brand { font: 800 22px Inter; letter-spacing: .6em; color: #cfc6b8; text-transform: uppercase; }
  .brand b { color: var(--gold); }
  .presents { font: 500 18px Inter; letter-spacing: .35em; color: #9d92a8; text-transform: uppercase; }
  .logo { font: 900 92px Cinzel, serif; color: var(--gold); text-shadow: 0 6px 50px rgba(227,191,106,.4); line-height: 1; }
  .logo em { font-style: normal; color: #ece4d4; }
  .tag { font: 700 26px Inter; color: #ece4d4; }
  .tag span { color: var(--gold); }
  .cta { display: inline-block; margin-top: 10px; padding: 14px 30px; border-radius: 999px; background: var(--gold); color: #1d1408; font: 800 24px Inter; }
  .small { font: 500 16px Inter; color: #9d92a8; }
  .line { width: 0; height: 2px; margin: 6px auto; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  @keyframes in { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes out { to { opacity: 0; transform: translateY(-12px); } }
  @keyframes grow { to { width: 520px; } }
  .scene.on .line { animation: grow 1.4s .4s cubic-bezier(.16,1,.3,1) forwards; }
  .dice { position: absolute; font-size: 54px; opacity: .14; animation: float 6s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-16px) rotate(12deg); } }
</style></head>
<body>
<div class="stage" id="stage"></div>
<script>
  const mode = new URLSearchParams(location.search).get('m');
  const stage = document.getElementById('stage');
  const deco = ['🎲', '⚔', '🛡', '✦', '🗝', '🐉'].map((d, i) => `<div class="dice" style="left:${8 + i * 16}%;top:${i % 2 ? 78 : 12}%;animation-delay:${i * .7}s">${d}</div>`).join('');
  const scenes = {
    intro: [
      [0, 2600, `<div class="brand"><b>KIOSKO</b> PRODUCTIONS</div><div class="line"></div><div class="presents">presenta</div>`],
      [2900, 9000, `<div class="logo">Dungeon<em>Dumbtastic</em></div><div class="tag">Tu mesa de rol. <span>En el navegador.</span> Con tus amigos.</div>`],
    ],
    outro: [
      [0, 9000, `<div class="logo">Dungeon<em>Dumbtastic</em></div><div class="tag">Mapas · niebla · dados 3D · fichas · libros · notas</div>
        <div><span class="cta">Reserva tu mesa por horas</span></div><div class="line"></div>
        <div class="brand"><b>KIOSKO</b> PRODUCTIONS</div><div class="small">Pídenos el enlace y jugad esta misma noche</div>`],
    ],
  }[mode] || [];
  stage.innerHTML = deco;
  scenes.forEach(([at, until, html]) => {
    const el = document.createElement('div');
    el.className = 'scene';
    el.innerHTML = html;
    stage.append(el);
    setTimeout(() => { el.classList.add('on'); el.style.animation = 'in .9s cubic-bezier(.16,1,.3,1) forwards'; }, at);
    setTimeout(() => { el.style.animation = 'out .6s forwards'; }, until);
  });
</script>
</body></html>
